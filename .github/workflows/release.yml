name: release
on:
  push:
    tags: ['v*.*.*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: dist matches tag
        run: git diff --exit-code -- dist
      - name: Create GitHub release with CDN links
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V="${GITHUB_REF_NAME#v}"
          BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${V}/dist"
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes "$(printf '```html\n<link rel="stylesheet" href="%s/tokens.css">\n<link rel="stylesheet" href="%s/ng-zorro-override.css">\n```' "$BASE" "$BASE")"

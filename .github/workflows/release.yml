name: release
# Creates the tag and the GitHub release when a new version lands on main. See scripts/release.sh.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)publish, e.g. v0.6.0
        required: true
      commit:
        description: Commit to tag when the tag does not exist yet (default - the latest commit of the selected branch)
        required: false
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Create or update the release
        run: bash scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.commit }}
